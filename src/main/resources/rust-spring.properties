# Rust-Spring Performance Configuration
# Constraint #8: Properties bazlı config

# Server Configuration
server.port=8080
server.host=0.0.0.0

# Runtime profile presets: default, low-rss, balanced-dubbo, throughput.
# System properties/env vars still override profile values.
reactor.runtime.profile=default

# Database Configuration (örnek)
db.url=jdbc:postgresql://localhost:5432/rust_spring
db.pool.size=10
db.timeout.ms=5000

# Native Library
native.library.path=native/rust_hyper.dll

# Native HTTP runtime limits
# Keep these bounded; increasing per-request limits without inflight caps can destroy RSS.
reactor.rust.http.max-request-body-bytes=1048576
reactor.rust.http.max-response-body-bytes=8388608
reactor.rust.http.max-inflight-body-bytes=33554432
reactor.rust.http.max-inflight-response-bytes=67108864
reactor.rust.http.max-connections=1024
reactor.rust.http.max-request-header-bytes=16384
reactor.rust.http.max-request-headers=64
reactor.rust.http.header-read-timeout-ms=5000
reactor.rust.http.request-body-timeout-ms=10000
reactor.rust.http.idle-timeout-ms=30000
reactor.rust.http.http1-only-enabled=false
reactor.rust.http.keep-alive-enabled=true
reactor.rust.log.level=error
reactor.rust.java.log.level=warn

# Native FileResponse stream chunk size. Larger chunks reduce per-response read/frame overhead,
# but too large a value increases transient native buffers under high download fanout.
reactor.rust.file-stream.chunk-bytes=65536

# Immutable @NativeStaticFileRoute files at or below this size are loaded into
# native memory once and served without disk I/O. Larger files stay streamed.
reactor.rust.static-file.inline-max-bytes=524288

# Disk-backed @NativeStaticFileRoute streams use a separate bulkhead. This protects
# file descriptors, Tokio blocking I/O workers, RSS, and p99 under download fanout.
reactor.rust.static-file.max-concurrent-streams=128

# Native WebSocket runtime limits
# Bounded per-session outbound queue prevents unbounded RSS growth under slow consumers.
reactor.rust.websocket.max-frame-bytes=1048576
reactor.rust.websocket.outbound-queue-capacity=1024
reactor.rust.websocket.send-timeout-ms=5000

# 0 = auto, based on CPU with Rust-side cap.
reactor.rust.jni.workers=0
reactor.rust.jni.queue-capacity=1024

# Response body pool caps. Low-RSS default keeps retained native buffers bounded;
# throughput profile can override these upward during benchmark/deployment.
reactor.rust.response-pool.small-capacity=256
reactor.rust.response-pool.medium-capacity=384
reactor.rust.response-pool.large-capacity=16
reactor.rust.response-pool.huge-capacity=2

# Native dynamic response cache for repeated read-heavy payloads.
reactor.rust.native-cache.max-entries=1024
reactor.rust.native-cache.max-bytes=16777216
reactor.rust.native-cache.ttl-ms=300000

# Rust/Tokio runtime sizing. 0 = auto.
reactor.rust.runtime.worker-threads=0
reactor.rust.runtime.max-blocking-threads=0
reactor.rust.runtime.thread-stack-bytes=0

# DSL-JSON writer retention cap: prevents large one-off responses from pinning big byte[] per JNI worker.
reactor.rust.json.writer-initial-bytes=4096
reactor.rust.json.writer-retain-max-bytes=262144
# If a generated/manual DirectJsonWriter is registered for an exact DTO class, use it before DSL-JSON.
reactor.rust.json.direct-writer-enabled=true

# Async HTTP route bridge. Keeps JNI workers free while Java CompletionStage routes complete later.
reactor.rust.async.max-inflight=1024
reactor.rust.async.response-timeout-ms=2000

# Route optimizer visibility.
# observe = log/report route strategies without failing startup.
# strict or fail-on-* properties make optimization regressions fail fast at startup.
reactor.optimizer.mode=observe
reactor.optimizer.report.enabled=true
reactor.optimizer.report.verbose=true
reactor.optimizer.runtime-metrics-enabled=false
reactor.optimizer.fail-on-fallback=false
reactor.optimizer.fail-on-legacy=false
reactor.optimizer.fail-on-implicit-raw-request-data=false
reactor.optimizer.required-fast-routes=

# Lite Dubbo consumer demo.
# Provider nodes are read from /{registry-root}/{encoded-interface}/providers.
reactor.dubbo.enabled=true
reactor.dubbo.application-name=rust-java-rest-consumer
reactor.dubbo.registry-address=zookeeper://127.0.0.1:2181
reactor.dubbo.registry-root=dubbo
# Static provider mode bypasses Java ZooKeeper watcher in the hot JVM.
# Blank value uses ZooKeeper discovery and requires the optional ZooKeeper dependency at runtime.
reactor.dubbo.providers=127.0.0.1:20880
reactor.dubbo.timeout-ms=800
reactor.dubbo.retries=0
reactor.dubbo.check=false
reactor.dubbo.registry-check=false
reactor.dubbo.connections=1
reactor.dubbo.share-connections=1
reactor.dubbo.refer-thread-num=1
reactor.dubbo.max-inflight=64
reactor.dubbo.max-response-bytes=8388608
reactor.dubbo.native-connections-per-endpoint=2
reactor.dubbo.native-async-workers=2
reactor.dubbo.native-async-queue-capacity=128
reactor.dubbo.catalog.adaptive-enabled=true
reactor.dubbo.catalog.min-inflight=2
reactor.dubbo.catalog.initial-inflight=4
reactor.dubbo.catalog.max-inflight=4
reactor.dubbo.catalog.response-timeout-ms=800
reactor.dubbo.catalog.target-latency-ms=75
reactor.dubbo.catalog.high-latency-ms=250
reactor.dubbo.catalog.adaptive-sample-size=128
reactor.dubbo.catalog.adaptive-increase-step=1
reactor.dubbo.catalog.adaptive-decrease-percent=75
reactor.dubbo.catalog.rpc-workers=1
reactor.dubbo.catalog.rpc-queue-capacity=0
reactor.dubbo.runtime-profile=low-rss
reactor.dubbo.transport=native
reactor.dubbo.cluster=failfast
reactor.dubbo.loadbalance=random
reactor.dubbo.serialization=hessian2
