# Rust-Spring Performance Configuration
# Constraint #8: Properties bazlı config

# Server Configuration
server.port=8080
server.host=0.0.0.0

# Runtime profile presets: default, micro-rest, micro-rest-plus, micro-dubbo, fast-start, ready-low-latency,
# low-rss, balanced-dubbo, throughput.
# System properties/env vars still override profile values.
reactor.runtime.profile=micro-rest
reactor.application.name=reactor-application
reactor.health.enabled=true
reactor.openapi.enabled=false
reactor.openapi.ui.enabled=false
reactor.openapi.swagger-ui.enabled=false
reactor.security.enabled=false
reactor.security.jwt.hmac-secret=
reactor.security.jwt.issuer=
reactor.security.jwt.audience=
reactor.security.jwt.roles-claim=roles
reactor.security.jwt.subject-claim=sub
reactor.security.jwt.clock-skew-seconds=30
reactor.security.jwt.max-token-chars=8192
reactor.security.jwt.require-expiration=true
reactor.tracing.enabled=false
reactor.tracing.annotated-only=false
reactor.tracing.sample-ratio=0.01
reactor.cache.enabled=true
reactor.scheduler.enabled=true
reactor.scheduler.threads=1
reactor.scheduler.max-tasks=64
reactor.scheduler.shutdown-timeout-ms=5000
reactor.http-client.threads=2
reactor.http-client.queue-capacity=256
reactor.http-client.max-inflight=128
reactor.http-client.connect-timeout-ms=1000
reactor.http-client.request-timeout-ms=2000
reactor.http-client.retries=1
reactor.http-client.retry-backoff-ms=25
reactor.http-client.max-request-bytes=8388608
reactor.http-client.max-response-bytes=8388608
reactor.http-client.max-headers=32
reactor.http-client.allow-core-thread-timeout=true
reactor.http-client.shutdown-timeout-ms=5000

# Database Configuration (örnek)
db.url=jdbc:postgresql://localhost:5432/rust_spring
db.pool.size=10
db.timeout.ms=5000

# Native Library
reactor.native.load.java-library-path-first=false
reactor.native.extract.cache.enabled=true
reactor.native.extract.cache-dir=

# Startup acceleration and visibility.
# Application entry points use fail-closed AOT startup. Set compatibility only while migrating
# an application that has not enabled the build-time code generator.
reactor.startup.mode=aot
# Starters generate this list. Empty keeps property-based compatibility while migrating.
reactor.native.capabilities=
# components.idx avoids classpath scanning when generated by the application build.
reactor.startup.component-index.enabled=true
reactor.startup.component-index.required=false
reactor.startup.route-index.validate=false
reactor.startup.route-index.required=false
reactor.startup.scan.fallback-enabled=false
reactor.startup.prewarm.enabled=false
reactor.startup.prewarm.json=true

# OpenJ9/Semeru InstantOn checkpoint. Disabled by default.
# Enable only in a Linux container checkpoint build before opening HTTP/DB/RPC/ZK sockets.
reactor.instanton.checkpoint.enabled=false
reactor.instanton.checkpoint.dir=/checkpoint
reactor.instanton.checkpoint.fail-on-unavailable=true
reactor.instanton.checkpoint.leave-running=false
reactor.instanton.checkpoint.shell-job=true
reactor.instanton.checkpoint.file-locks=true
reactor.instanton.checkpoint.auto-dedup=false
reactor.instanton.checkpoint.tcp-close=true
reactor.instanton.checkpoint.log-file=checkpoint.log
reactor.instanton.checkpoint.log-level=4

# Native HTTP runtime limits
# Keep these bounded; increasing per-request limits without inflight caps can destroy RSS.
reactor.rust.http.max-request-body-bytes=1048576
reactor.rust.http.max-response-body-bytes=8388608
reactor.rust.http.max-inflight-body-bytes=33554432
reactor.rust.http.max-inflight-response-bytes=67108864
reactor.rust.http.max-connections=1024
reactor.rust.http.max-request-header-bytes=16384
reactor.rust.http.max-request-headers=64
reactor.rust.http.header-read-timeout-ms=5000
reactor.rust.http.request-body-timeout-ms=10000
reactor.rust.http.idle-timeout-ms=30000
reactor.rust.http.http1-only-enabled=false
reactor.rust.http.keep-alive-enabled=true
reactor.rust.log.level=error
reactor.rust.java.log.level=warn

# Native FileResponse stream chunk size. Larger chunks reduce per-response read/frame overhead,
# but too large a value increases transient native buffers under high download fanout.
reactor.rust.file-stream.chunk-bytes=65536

# Immutable @NativeStaticFileRoute files at or below this size are loaded into
# native memory once and served without disk I/O. Larger files stay streamed.
reactor.rust.static-file.inline-max-bytes=524288

# Disk-backed @NativeStaticFileRoute streams use a separate bulkhead. This protects
# file descriptors, Tokio blocking I/O workers, RSS, and p99 under download fanout.
reactor.rust.static-file.max-concurrent-streams=128

# Native WebSocket runtime limits
# Bounded per-session outbound queue prevents unbounded RSS growth under slow consumers.
reactor.rust.websocket.max-frame-bytes=1048576
reactor.rust.websocket.outbound-queue-capacity=1024
reactor.rust.websocket.send-timeout-ms=5000

# 0 = auto, based on CPU with Rust-side cap.
reactor.rust.jni.workers=0
reactor.rust.jni.queue-capacity=1024

# Response body pool caps. 0 disables retention for that bucket; it does not reject a response.
# Low-RSS profiles keep retained native buffers bounded. Throughput profiles can raise these only
# after an RSS/p99 gate.
reactor.rust.response-pool.small-capacity=256
reactor.rust.response-pool.medium-capacity=384
reactor.rust.response-pool.large-capacity=16
reactor.rust.response-pool.huge-capacity=2

# Native dynamic response cache for repeated read-heavy payloads.
reactor.rust.native-cache.max-entries=1024
reactor.rust.native-cache.max-bytes=16777216
reactor.rust.native-cache.ttl-ms=300000

# Idle native allocator trim.
# Keep disabled for latency-first services. Enable only for memory-first pods after measuring p99.
# The trim runs in a background daemon thread after the service is idle; it never runs on request
# handlers. Environment example: REACTOR_RUST_NATIVE_TRIM_ENABLED=true.
# Background trim uses a soft retained-pool path. Manual /diagnostics/native/trim is full trim.
reactor.rust.native-trim.enabled=false
reactor.rust.native-trim.initial-delay-ms=30000
reactor.rust.native-trim.interval-ms=60000
reactor.rust.native-trim.min-idle-ms=10000
reactor.rust.native-trim.max-active-connections=0
reactor.rust.native-trim.max-active-requests=0
# Keep a tiny warm floor for small JSON responses; reclaim larger buckets in memory-first pods.
reactor.rust.native-trim.retain-small=16
reactor.rust.native-trim.retain-medium=0
reactor.rust.native-trim.retain-large=0
reactor.rust.native-trim.retain-huge=0
# true returns idle native pages to the OS; false only shrinks response pools.
reactor.rust.native-trim.allocator-trim-enabled=true

# Rust/Tokio runtime sizing. 0 = auto.
reactor.rust.runtime.worker-threads=0
reactor.rust.runtime.max-blocking-threads=0
reactor.rust.runtime.thread-stack-bytes=0
reactor.rust.jni.thread-stack-bytes=0
reactor.rust.server.thread-stack-bytes=0

# DSL-JSON writer retention cap: prevents large one-off responses from pinning big byte[] per JNI worker.
reactor.rust.json.writer-initial-bytes=4096
reactor.rust.json.writer-retain-max-bytes=262144
reactor.rust.json.fail-on-service-loader-error=true
# If a generated/manual DirectJsonWriter is registered for an exact DTO class, use it before DSL-JSON.
reactor.rust.json.direct-writer-enabled=true

# Async HTTP route bridge. Keeps JNI workers free while Java CompletionStage routes complete later.
reactor.rust.async.max-inflight=1024
reactor.rust.async.response-timeout-ms=2000
# First async response allocation. This is not a response-size limit. Larger responses retry with
# their required bounded size; setting it below the common payload size adds a serialization retry.
reactor.rust.async.frame-initial-bytes=16384
reactor.rust.async.frame-retain-max-bytes=262144
# Total reusable async completion frames. This is process-wide, not per thread.
reactor.rust.async.frame-pool-capacity=8
# Low-RSS default: keep async completion frames on heap. Enable direct buffers only after an RSS/p99 gate.
reactor.rust.async.direct-buffer.enabled=false

# Public error responses are bounded and hide internal exception details by default.
reactor.rust.errors.include-internal-message=false
reactor.rust.errors.max-message-chars=512
reactor.rust.errors.format=problem-details

# Server lifecycle gates. Startup waits for a successful bind; stop waits for bounded connection drain.
reactor.rust.server.startup-timeout-ms=10000
reactor.rust.server.graceful-shutdown-timeout-ms=30000

# Route-level native admission. Disabled per route unless @RouteAdmission or a
# route-specific property supplies max-concurrent > 0.
# Optional workload/budget-level defaults apply before route-specific overrides:
# reactor.rust.route-workload.heavy-json.route-admission.max-concurrent=96
# reactor.rust.route-budget.heavy-json-direct.route-admission.max-concurrent=80
# reactor.rust.route-budget.heavy-json-direct.route-admission.queue-timeout-ms=150
# Route override key format:
# reactor.rust.route-admission.<method.path.sanitized>.max-concurrent=64
# reactor.rust.route-admission.<method.path.sanitized>.queue-timeout-ms=50
# Example for GET /api/v1/heavy:
# reactor.rust.route-admission.get.api.v1.heavy.max-concurrent=64
# reactor.rust.route-admission.get.api.v1.heavy.queue-timeout-ms=50
# Do not use route admission as the first tool for tiny bodyless/direct routes that only fill the
# JNI queue. Route admission holds the permit until the whole response completes. Use the
# jni-admission block below when the problem is only JNI queue pressure.
reactor.rust.route-admission.enabled=true
reactor.rust.route-admission.default-max-concurrent=0
reactor.rust.route-admission.default-queue-timeout-ms=0

# Advanced route-level JNI queue admission. Use only after a repeat benchmark shows a very fast
# bodyless/direct route is filling the global JNI queue and the service accepts an extra priority JNI
# worker. Unlike route admission, the permit is released when a JNI worker starts executing the job,
# not when the whole response completes.
# Route override key format:
# reactor.rust.jni-admission.<method.path.sanitized>.max-pending=512
# reactor.rust.jni-admission.<method.path.sanitized>.queue-timeout-ms=0
# Example for GET /api/v1/candidates/direct:
# reactor.rust.jni-admission.get.api.v1.candidates.direct.max-pending=512
# reactor.rust.jni-admission.get.api.v1.candidates.direct.queue-timeout-ms=0
reactor.rust.jni-admission.enabled=true
reactor.rust.jni-admission.default-max-pending=0
reactor.rust.jni-admission.default-queue-timeout-ms=0

# Route optimizer visibility.
# observe = log/report route strategies without failing startup.
# strict or fail-on-* properties make optimization regressions fail fast at startup.
reactor.optimizer.mode=observe
reactor.optimizer.report.enabled=true
reactor.optimizer.report.verbose=true
reactor.optimizer.runtime-metrics-enabled=false
reactor.optimizer.fail-on-fallback=false
reactor.optimizer.fail-on-legacy=false
reactor.optimizer.fail-on-implicit-raw-request-data=false
reactor.optimizer.fail-on-heavy-json-object-graph=false
reactor.optimizer.fail-on-benchmark-only-routes=false
reactor.optimizer.required-fast-routes=

# Lite Dubbo consumer.
# Provider nodes are read from /{registry-root}/{encoded-interface}/providers.
reactor.dubbo.enabled=false
reactor.dubbo.application-name=rust-java-rest-consumer
reactor.dubbo.registry-address=zookeeper://127.0.0.1:2181
reactor.dubbo.registry-root=dubbo
# Static provider mode bypasses Java ZooKeeper watcher in the hot JVM.
# Blank value uses ZooKeeper discovery and requires the optional ZooKeeper dependency at runtime.
reactor.dubbo.providers=
reactor.dubbo.timeout-ms=800
reactor.dubbo.retries=0
reactor.dubbo.check=false
reactor.dubbo.registry-check=false
reactor.dubbo.connections=1
reactor.dubbo.share-connections=1
reactor.dubbo.refer-thread-num=1
reactor.dubbo.max-inflight=32
reactor.dubbo.max-response-bytes=8388608
reactor.dubbo.native-connections-per-endpoint=1
reactor.dubbo.native-max-idle-connections-per-endpoint=1
reactor.dubbo.native-async-workers=1
reactor.dubbo.native-async-queue-capacity=32
reactor.dubbo.native-async-transport=blocking
reactor.dubbo.catalog.adaptive-enabled=true
reactor.dubbo.catalog.min-inflight=1
reactor.dubbo.catalog.initial-inflight=2
reactor.dubbo.catalog.max-inflight=2
reactor.dubbo.catalog.response-timeout-ms=800
reactor.dubbo.catalog.target-latency-ms=75
reactor.dubbo.catalog.high-latency-ms=250
reactor.dubbo.catalog.adaptive-sample-size=64
reactor.dubbo.catalog.adaptive-increase-step=1
reactor.dubbo.catalog.adaptive-decrease-percent=75
reactor.dubbo.catalog.rpc-workers=0
reactor.dubbo.catalog.rpc-queue-capacity=0
reactor.dubbo.runtime-profile=micro-dubbo
reactor.dubbo.transport=native
reactor.dubbo.cluster=failfast
reactor.dubbo.loadbalance=random
reactor.dubbo.serialization=hessian2
