name: Sync v3.2.0 release notes and cleanup rc3 draft

on:
  push:
    branches:
      - master
    paths:
      - ".github/workflows/cleanup-rc3-draft-release.yml"

permissions:
  contents: write

jobs:
  cleanup:
    name: Sync v3.2.0 release body and delete stale rc3 draft
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Sync v3.2.0 release body
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("fs");
            const {owner, repo} = context.repo;
            const body = fs.readFileSync("docs/release-notes/v3.2.0.md", "utf8");
            const release = await github.rest.repos.getReleaseByTag({
              owner,
              repo,
              tag: "v3.2.0"
            });
            await github.rest.repos.updateRelease({
              owner,
              repo,
              release_id: release.data.id,
              body,
              draft: false,
              prerelease: false
            });
            core.info(`Updated v3.2.0 release body from docs/release-notes/v3.2.0.md`);

      - name: Delete draft release if present
        uses: actions/github-script@v7
        with:
          script: |
            const {owner, repo} = context.repo;
            const releases = await github.paginate(github.rest.repos.listReleases, {
              owner,
              repo,
              per_page: 100
            });
            const stale = releases.filter((release) =>
              release.tag_name === "v3.1.0-rc3" ||
              release.name === "v3.1.0-rc3"
            );
            if (stale.length === 0) {
              core.info("No v3.1.0-rc3 release found.");
              return;
            }
            for (const release of stale) {
              core.info(`Deleting release id=${release.id} name=${release.name} tag=${release.tag_name} draft=${release.draft}`);
              await github.rest.repos.deleteRelease({
                owner,
                repo,
                release_id: release.id
              });
            }
