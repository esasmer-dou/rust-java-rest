name: Cleanup rc3 draft release

on:
  push:
    branches:
      - master
    paths:
      - ".github/workflows/cleanup-rc3-draft-release.yml"

permissions:
  contents: write

jobs:
  cleanup:
    name: Delete stale v3.1.0-rc3 draft release
    runs-on: ubuntu-latest
    steps:
      - name: Delete draft release if present
        uses: actions/github-script@v7
        with:
          script: |
            const {owner, repo} = context.repo;
            const releases = await github.paginate(github.rest.repos.listReleases, {
              owner,
              repo,
              per_page: 100
            });
            const stale = releases.filter((release) =>
              release.tag_name === "v3.1.0-rc3" ||
              release.name === "v3.1.0-rc3"
            );
            if (stale.length === 0) {
              core.info("No v3.1.0-rc3 release found.");
              return;
            }
            for (const release of stale) {
              core.info(`Deleting release id=${release.id} name=${release.name} tag=${release.tag_name} draft=${release.draft}`);
              await github.rest.repos.deleteRelease({
                owner,
                repo,
                release_id: release.id
              });
            }
