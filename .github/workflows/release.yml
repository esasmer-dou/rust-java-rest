name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, for example 4.3.0 or 4.3.0-rc1"
        required: true
        type: string
      repair_partial_package:
        description: "Delete and republish an incomplete GitHub Packages version"
        required: true
        default: false
        type: boolean

permissions:
  contents: write
  packages: write

jobs:
  release:
    name: Build, publish package, and create release
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve version
        id: version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Check out the requested release tag
        if: ${{ github.event_name == 'workflow_dispatch' }}
        shell: bash
        run: |
          git fetch --force --tags
          git checkout --detach "v${{ steps.version.outputs.version }}"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          server-id: github
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN

      - name: Add GitHub package credentials for dependency repositories
        shell: bash
        run: |
          mkdir -p "$HOME/.m2"
          cat > "$HOME/.m2/settings.xml" <<'EOF'
          <settings xmlns="http://maven.apache.org/SETTINGS/1.0.0"
                    xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
                    xsi:schemaLocation="http://maven.apache.org/SETTINGS/1.0.0 https://maven.apache.org/xsd/settings-1.0.0.xsd">
            <servers>
              <server>
                <id>github</id>
                <username>${env.GITHUB_ACTOR}</username>
                <password>${env.GITHUB_TOKEN}</password>
              </server>
              <server>
                <id>github-java-rust-dubbo</id>
                <username>${env.GITHUB_ACTOR}</username>
                <password>${env.GITHUB_TOKEN}</password>
              </server>
              <server>
                <id>github-rust-java-rest</id>
                <username>${env.GITHUB_ACTOR}</username>
                <password>${env.GITHUB_TOKEN}</password>
              </server>
            </servers>
          </settings>
          EOF
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Test and verify package boundaries
        run: mvn -B -ntp clean verify

      - name: Verify release version
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          CORE_VERSION="$(mvn -q help:evaluate -Dexpression=project.version -DforceStdout)"
          SAMPLE_VERSION="$(mvn -q -f sample/pom.xml help:evaluate -Dexpression=project.version -DforceStdout)"
          test "$VERSION" = "$CORE_VERSION"
          test "$VERSION" = "$SAMPLE_VERSION"

      - name: Verify native release provenance
        shell: bash
        run: |
          MANIFEST="src/main/resources/native/native-provenance.properties"
          test -f "$MANIFEST"
          grep -qx 'schema=2' "$MANIFEST"
          grep -qx 'rest.abi=28' "$MANIFEST"
          grep -qx 'dubbo.abi=7' "$MANIFEST"
          grep -qx 'redis.abi=6' "$MANIFEST"
          grep -qx 'glowroot.abi=1' "$MANIFEST"
          grep -Eq '^source.revision=[0-9a-f]{40}$' "$MANIFEST"
          ! grep -q -- '-dirty$' "$MANIFEST"
          LINUX_EXPECTED="$(sed -n 's/^linux-x64.sha256=//p' "$MANIFEST")"
          WINDOWS_EXPECTED="$(sed -n 's/^windows-x64.sha256=//p' "$MANIFEST")"
          test "$(sha256sum src/main/resources/native/linux-x64/librust_hyper.so | awk '{print $1}')" = "$LINUX_EXPECTED"
          test "$(sha256sum src/main/resources/native/windows-x64/rust_hyper.dll | awk '{print $1}')" = "$WINDOWS_EXPECTED"

      - name: Build isolated sample application
        shell: bash
        run: |
          mvn -B -DskipTests install
          mvn -B -DskipTests -f sample/pom.xml package

      - name: Remove incomplete Maven package version
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.repair_partial_package }}
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          API_PATH="/users/${GITHUB_REPOSITORY_OWNER}/packages/maven/com.reactor.rust-java-rest/versions"
          VERSION_ID="$(gh api --paginate "${API_PATH}?per_page=100" --jq ".[] | select(.name == \"${VERSION}\") | .id" | head -n 1)"
          if [ -n "${VERSION_ID}" ]; then
            gh api --method DELETE "${API_PATH}/${VERSION_ID}"
          fi
          for attempt in $(seq 1 12); do
            REMAINING="$(gh api --paginate "${API_PATH}?per_page=100" --jq ".[] | select(.name == \"${VERSION}\") | .id" | head -n 1)"
            if [ -z "${REMAINING}" ]; then
              exit 0
            fi
            sleep 5
          done
          echo "Package version ${VERSION} was not deleted in time" >&2
          exit 1

      - name: Publish Maven package
        run: >-
          mvn -B -ntp -DskipTests
          -DretryFailedDeploymentCount=5
          -Daether.connector.basic.threads=1
          -Dmaven.wagon.http.retryHandler.count=5
          deploy

      - name: Prepare release assets
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          mkdir -p "release-assets"
          cp "target/rust-java-rest-${VERSION}.jar" "release-assets/"
          cp "target/rust-java-rest-${VERSION}-codegen.jar" "release-assets/"
          cp "sample/target/rust-java-rest-${VERSION}-sample.jar" "release-assets/"
          cp "target/rust-java-rest-${VERSION}-core-runtime.jar" "release-assets/"
          cp "target/rust-java-rest-${VERSION}-sources.jar" "release-assets/"
          cp "target/rust-java-rest-${VERSION}-javadoc.jar" "release-assets/"
          cp "src/main/resources/native/windows-x64/rust_hyper.dll" "release-assets/rust_hyper-windows-x64.dll"
          cp "src/main/resources/native/linux-x64/librust_hyper.so" "release-assets/librust_hyper-linux-x64.so"
          (cd release-assets && sha256sum * > SHA256SUMS)

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: v${{ steps.version.outputs.version }}
          tag_name: v${{ steps.version.outputs.version }}
          body_path: docs/release-notes/v${{ steps.version.outputs.version }}.md
          prerelease: ${{ contains(steps.version.outputs.version, '-') }}
          files: release-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
