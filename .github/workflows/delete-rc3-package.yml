name: Delete rc3 package version

on:
  push:
    branches:
      - master
    paths:
      - ".github/workflows/delete-rc3-package.yml"

permissions:
  contents: read
  packages: write

jobs:
  delete:
    runs-on: ubuntu-latest
    steps:
      - name: Delete Maven package version 3.1.0-rc3
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const packageType = 'maven';
            const packageName = 'com.reactor.rust-java-rest';
            const targetVersion = '3.1.0-rc3';

            async function listVersions(scope) {
              if (scope === 'org') {
                return github.request(
                  'GET /orgs/{org}/packages/{package_type}/{package_name}/versions',
                  { org: owner, package_type: packageType, package_name: packageName, per_page: 100 }
                );
              }
              return github.request(
                'GET /users/{username}/packages/{package_type}/{package_name}/versions',
                { username: owner, package_type: packageType, package_name: packageName, per_page: 100 }
              );
            }

            async function deleteVersion(scope, versionId) {
              if (scope === 'org') {
                return github.request(
                  'DELETE /orgs/{org}/packages/{package_type}/{package_name}/versions/{package_version_id}',
                  { org: owner, package_type: packageType, package_name: packageName, package_version_id: versionId }
                );
              }
              return github.request(
                'DELETE /users/{username}/packages/{package_type}/{package_name}/versions/{package_version_id}',
                { username: owner, package_type: packageType, package_name: packageName, package_version_id: versionId }
              );
            }

            let selectedScope = null;
            let versions = null;
            for (const scope of ['org', 'user']) {
              try {
                versions = await listVersions(scope);
                selectedScope = scope;
                break;
              } catch (error) {
                core.info(`${scope} package lookup failed: ${error.status || error.message}`);
              }
            }

            if (!versions) {
              core.setFailed(`Package ${packageName} was not found for ${owner}`);
              return;
            }

            const target = versions.data.find((version) => version.name === targetVersion);
            if (!target) {
              core.info(`Package version ${targetVersion} is already absent.`);
              return;
            }

            await deleteVersion(selectedScope, target.id);
            core.info(`Deleted ${packageName} ${targetVersion} from ${selectedScope} scope.`);
